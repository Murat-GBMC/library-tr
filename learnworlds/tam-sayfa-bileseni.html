<!--
  GBMC CoE — Kütüphane ve Bağlantılar bileşeni
  LearnWorlds sayfasına "Embed / Custom code" öğesi olarak bu dosyanın TAMAMINI yapıştırın.

  Ayarlar (aşağıdaki div'in data- öznitelikleri):
    data-src       : depodaki data/kutuphane.json dosyasının raw adresi
    data-platform  : "CoE" veya "PDU Circle" — o platformda gösterilecek kaynaklar süzülür
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<div id="gbmc-kutuphane"
     data-src="https://raw.githubusercontent.com/Murat-GBMC/library-tr/main/data/kutuphane.json"
     data-platform="CoE"></div>

<style>
#gbmc-kutuphane{--t:#0B6A6A;--td:#0B3B3D;--ink:#0E2427;--ink2:#1D3538;--mut:#4A5F62;--line:#D5E0E0;--soft:#EEF3F3;--bg:#F4F7F7;--mint:#E1F0EF;
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);font-size:16px;line-height:1.5;background:var(--bg);box-sizing:border-box}
#gbmc-kutuphane *,#gbmc-kutuphane *::before,#gbmc-kutuphane *::after{box-sizing:border-box}
#gbmc-kutuphane a{color:var(--t)}#gbmc-kutuphane a:hover{color:#074848}
#gbmc-kutuphane .gk-wrap{max-width:1120px;margin:0 auto;padding:24px 16px 64px;display:flex;flex-direction:column;gap:44px}
#gbmc-kutuphane .gk-nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
#gbmc-kutuphane .gk-nav-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#gbmc-kutuphane .gk-chip{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;line-height:1;text-decoration:none;cursor:pointer;white-space:nowrap}
#gbmc-kutuphane .gk-chip span{font-weight:500;color:var(--mut)}
#gbmc-kutuphane .gk-chip.gk-pri{background:var(--t);border-color:var(--t);color:#fff}
#gbmc-kutuphane .gk-chip.gk-pri span{color:#CFE9E6}
#gbmc-kutuphane .gk-chip:focus-visible,#gbmc-kutuphane button:focus-visible,#gbmc-kutuphane a:focus-visible{outline:3px solid #F2A65A;outline-offset:2px}
#gbmc-kutuphane .gk-tr{margin-left:auto;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
#gbmc-kutuphane .gk-tr input{width:20px;height:20px;accent-color:var(--t);margin:0}
#gbmc-kutuphane .gk-sec{display:flex;flex-direction:column;gap:18px;scroll-margin-top:140px}
#gbmc-kutuphane .gk-sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px;border-bottom:2px solid var(--t);padding-bottom:10px}
#gbmc-kutuphane .gk-sec-h h2{margin:0;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
#gbmc-kutuphane .gk-sec-h div{font-size:15px;color:var(--mut)}
#gbmc-kutuphane .gk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-items:start}
#gbmc-kutuphane .gk-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:13px}
#gbmc-kutuphane .gk-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--t);text-transform:uppercase;letter-spacing:.06em}
#gbmc-kutuphane .gk-meta svg{flex:none}
#gbmc-kutuphane .gk-meta .gk-dur{color:var(--mut);text-transform:none;letter-spacing:0;font-weight:600}
#gbmc-kutuphane .gk-card h3{margin:0;font-size:18.5px;line-height:1.3;font-weight:700;color:var(--ink)}
#gbmc-kutuphane .gk-src{font-size:14px;color:var(--mut);margin-top:3px}
#gbmc-kutuphane .gk-tags{display:flex;flex-wrap:wrap;gap:6px}
#gbmc-kutuphane .gk-tag{padding:3px 10px;border-radius:6px;font-size:13px;font-weight:600;background:var(--soft);color:var(--ink)}
#gbmc-kutuphane .gk-free{background:var(--mint);color:#0B5555}
#gbmc-kutuphane .gk-part{background:#FBEFE2;color:#7A410C}
#gbmc-kutuphane .gk-paid{background:#ECEFF0;color:#3E5053}
#gbmc-kutuphane .gk-lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:3px}
#gbmc-kutuphane .gk-note{margin:0;font-size:15px;color:var(--ink2)}
#gbmc-kutuphane .gk-act{display:flex;flex-wrap:wrap;gap:10px}
#gbmc-kutuphane .gk-go{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;background:var(--t);color:#fff !important;font-size:15px;font-weight:700;text-decoration:none}
#gbmc-kutuphane .gk-go:hover{background:#085656}
#gbmc-kutuphane .gk-more{min-height:44px;padding:0 16px;border-radius:10px;background:#fff;border:1px solid #B9CCCC;color:var(--ink);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer}
#gbmc-kutuphane .gk-det{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:14px}
#gbmc-kutuphane .gk-det[hidden]{display:none}
#gbmc-kutuphane .gk-q{background:var(--mint);border-radius:12px;padding:13px 15px}
#gbmc-kutuphane .gk-q .gk-lbl{color:#0B5555}
#gbmc-kutuphane .gk-q p{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
#gbmc-kutuphane .gk-gbmc{font-size:15px;font-weight:700;color:var(--t)}
#gbmc-kutuphane .gk-aud{display:flex;flex-wrap:wrap;gap:6px}
#gbmc-kutuphane .gk-aud span{padding:3px 10px;border-radius:999px;border:1px solid #B9CCCC;font-size:13px;color:var(--ink2)}
#gbmc-kutuphane .gk-inst{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px 30px}
#gbmc-kutuphane .gk-inst h3{margin:0 0 10px;font-size:16px;font-weight:700}
#gbmc-kutuphane .gk-inst ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
#gbmc-kutuphane .gk-inst li a{font-weight:700;text-decoration:none;font-size:15px}
#gbmc-kutuphane .gk-inst li a:hover{text-decoration:underline}
#gbmc-kutuphane .gk-inst li div{font-size:13.5px;color:var(--mut)}
#gbmc-kutuphane .gk-msg{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;color:var(--mut)}
#gbmc-kutuphane .gk-foot{font-size:13px;color:var(--mut)}
@media (max-width:640px){
  #gbmc-kutuphane .gk-nav-in{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  #gbmc-kutuphane .gk-tr{margin-left:0;flex:none}
  #gbmc-kutuphane .gk-grid{grid-template-columns:1fr}
  #gbmc-kutuphane .gk-act{flex-direction:column}
  #gbmc-kutuphane .gk-go,#gbmc-kutuphane .gk-more{width:100%}
  #gbmc-kutuphane .gk-sec-h h2{font-size:22px}
}
</style>

<script>
(function () {
  var root = document.getElementById('gbmc-kutuphane');
  if (!root) return;
  var SRC = root.getAttribute('data-src');
  var PLATFORM = root.getAttribute('data-platform') || 'CoE';

  var KATEGORILER = [
    { ad: 'Stratejiden İcraya', id: 'strateji', alt: 'Stratejik uyum, hedefler ve öncelikler', oncelik: true },
    { ad: 'Sonuç ve Taahhüt Yönetimi', id: 'sonuc', alt: 'Taahhüt, takip ve hesap verebilirlik', oncelik: true },
    { ad: 'Proje, Portföy ve PMO', id: 'proje', alt: 'Proje, portföy, PMO ve yönetişim' },
    { ad: 'Modern Delivery', id: 'delivery', alt: 'Agile, hibrit ve ürün odaklı çalışma' },
    { ad: 'Liderlik ve Ekip', id: 'liderlik', alt: 'Güven, ekip çalışması ve geri bildirim' },
    { ad: 'İşbirliği, Organizasyon ve Değişim', id: 'degisim', alt: 'Siloları aşmak, değişim ve dönüşüm' },
    { ad: 'AI ve Geleceğin Çalışma Biçimleri', id: 'ai', alt: 'Yapay zekâ, otomasyon ve geleceğin işi' }
  ];
  var KURUM_GRUP = {
    'Proje, Portföy ve PMO': 'Proje ve çeviklik',
    'Modern Delivery': 'Proje ve çeviklik',
    'AI ve Geleceğin Çalışma Biçimleri': 'Yapay zekâ ve geleceğin işi'
  };
  var CTA = { 'Makale': 'Oku', 'Video': 'İzle', 'Podcast': 'Dinle', 'Kitap': 'İncele', 'Online Eğitim': 'Eğitime git', 'Webinar': 'İzle' };
  var IKON = {
    'Makale': '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h6"/>',
    'Video': '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
    'Webinar': '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',
    'Podcast': '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
    'Kitap': '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
    'Rapor / Araştırma': '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
    'Model / Araç': '<path d="M12 3l9 16H3z"/><path d="M7.5 11h9M5.5 15h13"/>',
    'Online Eğitim': '<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/>',
    'Kurumsal Portal': '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'
  };

  var state = { veri: [], sadeceTr: false, acik: {} };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function guvenliUrl(u) { return /^https:\/\//i.test(u || '') ? u : '#'; }
  function erisimSinif(e) {
    if (e === 'Ücretsiz') return 'gk-free';
    if (e === 'Ücretli' || /ücretli\)/i.test(e)) return 'gk-paid';
    return 'gk-part';
  }
  function dilEtiket(d) { return d === 'TR' ? 'Türkçe' : d === 'EN' ? 'İngilizce' : d === 'TR + EN' ? 'Türkçe + İngilizce' : d; }
  function kaynakSatiri(k) { return k.yil ? k.kaynak + ' · ' + k.yil : k.kaynak; }

  function gorunur() {
    return state.veri.filter(function (k) {
      if (k.platform && k.platform !== 'Her ikisi' && k.platform !== PLATFORM) return false;
      if (state.sadeceTr && k.dil !== 'TR' && k.dil !== 'TR + EN') return false;
      return true;
    });
  }

  function kart(k) {
    var acik = !!state.acik[k.id];
    var detayVar = k.soru || (k.hedef && k.hedef.length);
    var h = '<article class="gk-card" data-id="' + esc(k.id) + '">';
    h += '<div class="gk-meta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (IKON[k.tur] || IKON['Makale']) + '</svg>';
    h += '<span>' + esc(k.tur) + '</span>' + (k.sure ? '<span aria-hidden="true" style="color:#8AA3A5">·</span><span class="gk-dur">' + esc(k.sure) + '</span>' : '') + '</div>';
    h += '<div><h3>' + esc(k.baslik) + '</h3><div class="gk-src">' + esc(kaynakSatiri(k)) + '</div></div>';
    h += '<div class="gk-tags"><span class="gk-tag">' + esc(dilEtiket(k.dil)) + '</span>';
    if (k.erisim) h += '<span class="gk-tag ' + erisimSinif(k.erisim) + '">' + esc(k.erisim) + '</span>';
    h += '</div>';
    if (k.not) h += '<div><div class="gk-lbl">Neden öneriyoruz?</div><p class="gk-note">' + esc(k.not) + '</p></div>';
    h += '<div class="gk-act"><a class="gk-go" href="' + esc(guvenliUrl(k.url)) + '" target="_blank" rel="noopener" data-git="' + esc(k.id) + '">' + esc(CTA[k.tur] || 'İncele') + ' →</a>';
    if (detayVar) h += '<button type="button" class="gk-more" aria-expanded="' + acik + '" aria-controls="gk-d-' + esc(k.id) + '" data-ac="' + esc(k.id) + '">' + (acik ? 'Detayları gizle' : 'Detaylar') + '</button>';
    h += '</div>';
    if (detayVar) {
      h += '<div class="gk-det" id="gk-d-' + esc(k.id) + '"' + (acik ? '' : ' hidden') + '>';
      if (k.soru) h += '<div class="gk-q"><p>' + esc(k.soru) + '</p></div>';
        if (k.hedef && k.hedef.length) {
        h += '<div><div class="gk-lbl">Kimler için</div><div class="gk-aud">';
        k.hedef.forEach(function (a) { h += '<span>' + esc(a) + '</span>'; });
        h += '</div></div>';
      }
      h += '</div>';
    }
    return h + '</article>';
  }

  function ciz() {
    var liste = gorunur();
    var say = {};
    liste.forEach(function (k) { say[k.kategori] = (say[k.kategori] || 0) + 1; });
    var kurumsal = liste.filter(function (k) { return k.kurumsal; });

    var h = '<nav class="gk-nav" aria-label="Kütüphane konuları"><div class="gk-nav-in">';
    KATEGORILER.forEach(function (c) {
      if (!say[c.ad]) return;
      h += '<a class="gk-chip' + (c.oncelik ? ' gk-pri' : '') + '" href="#gk-' + c.id + '">' + esc(c.ad) + ' <span>' + say[c.ad] + '</span></a>';
    });
    if (kurumsal.length) h += '<a class="gk-chip" href="#gk-kurumsal">Kurumsal kaynaklar <span>' + kurumsal.length + '</span></a>';
    h += '<label class="gk-tr"><input type="checkbox" data-tr' + (state.sadeceTr ? ' checked' : '') + '> Yalnızca Türkçe</label>';
    h += '</div></nav><div class="gk-wrap">';

    if (!liste.length) {
      h += '<div class="gk-msg">Bu seçimle eşleşen kaynak yok.</div>';
    }
    KATEGORILER.forEach(function (c) {
      var ks = liste.filter(function (k) { return k.kategori === c.ad; });
      if (!ks.length) return;
      h += '<section class="gk-sec" id="gk-' + c.id + '"><div class="gk-sec-h"><h2>' + esc(c.ad) + '</h2><div>' + esc(c.alt) + ' · ' + ks.length + ' kaynak</div></div><div class="gk-grid">';
      ks.forEach(function (k) { h += kart(k); });
      h += '</div></section>';
    });

    if (kurumsal.length) {
      var gruplar = { 'Proje ve çeviklik': [], 'Yapay zekâ ve geleceğin işi': [], 'Strateji ve dönüşüm araştırmaları': [] };
      kurumsal.forEach(function (k) { gruplar[KURUM_GRUP[k.kategori] || 'Strateji ve dönüşüm araştırmaları'].push(k); });
      h += '<section class="gk-sec" id="gk-kurumsal"><div class="gk-sec-h"><h2>Kurumsal kaynaklar</h2><div>Standartlar, araştırmalar ve portallar</div></div><div class="gk-inst">';
      Object.keys(gruplar).forEach(function (g) {
        if (!gruplar[g].length) return;
        h += '<div><h3>' + esc(g) + '</h3><ul>';
        gruplar[g].forEach(function (k) {
          h += '<li><a href="' + esc(guvenliUrl(k.url)) + '" target="_blank" rel="noopener" data-git="' + esc(k.id) + '">' + esc(k.baslik) + '</a><div>' + esc(k.kaynak) + ' · ' + esc(k.erisim) + '</div></li>';
        });
        h += '</ul></div>';
      });
      h += '</div></section>';
    }
    if (state.guncellendi) {
      var t = new Date(state.guncellendi);
      h += '<div class="gk-foot">Son güncelleme: ' + t.toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' }) + '</div>';
    }
    h += '</div>';
    root.innerHTML = h;
  }

  root.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ac]');
    if (b) {
      var id = b.getAttribute('data-ac');
      state.acik[id] = !state.acik[id];
      var d = root.querySelector('#gk-d-' + CSS.escape(id));
      if (d) d.hidden = !state.acik[id];
      b.setAttribute('aria-expanded', String(!!state.acik[id]));
      b.textContent = state.acik[id] ? 'Detayları gizle' : 'Detaylar';
      return;
    }
    var a = e.target.closest('a[href^="#gk-"]');
    if (a) {
      var hedef = root.querySelector(a.getAttribute('href'));
      if (hedef) { e.preventDefault(); hedef.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    }
  });
  root.addEventListener('change', function (e) {
    if (e.target.hasAttribute('data-tr')) { state.sadeceTr = e.target.checked; ciz(); }
  });

  function yukle(paket) {
    state.veri = (paket && paket.kaynaklar) || [];
    state.guncellendi = paket && paket.guncellendi;
    ciz();
  }

  if (window.GBMC_KUTUPHANE_VERI) { yukle(window.GBMC_KUTUPHANE_VERI); return; }
  root.innerHTML = '<div class="gk-wrap"><div class="gk-msg">Kütüphane yükleniyor…</div></div>';
  fetch(SRC + (SRC.indexOf('?') < 0 ? '?' : '&') + 't=' + Math.floor(Date.now() / 300000), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(yukle)
    .catch(function () {
      root.innerHTML = '<div class="gk-wrap"><div class="gk-msg">Kütüphane şu anda yüklenemedi. Lütfen sayfayı daha sonra yenileyin.</div></div>';
    });
})();
</script>
